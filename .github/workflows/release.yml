name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: votemera-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified main version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(jq -r .workflow_run.head_sha "$GITHUB_EVENT_PATH")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$sha" ]] || exit 0
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 -d | tr -d '\r\n')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "Votemera v$version" --generate-notes
