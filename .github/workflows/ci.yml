name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify anonymous access to public repository
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: git -c credential.helper= ls-remote --exit-code https://github.com/TeenKode/votemera.git refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --test tests/motion.test.cjs
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser end-to-end
        run: |
          export VOTEMERA_DB="$RUNNER_TEMP/votemera-browser.db" VOTEMERA_ADMIN_PASSWORD=test-secret VOTEMERA_TERMINAL_KEY=test-key
          python -m uvicorn app:app --host 127.0.0.1 --port 8765 &
          pid=$!
          trap 'kill "$pid"' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          python tests/browser_smoke.py
          python tests/browser_advanced.py
          python tests/browser_viewport.py
          python tests/browser_admin.py
